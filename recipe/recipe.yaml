context:
  version: "0.23.1"

package:
  name: ndonnx
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/n/ndonnx/ndonnx-${{ version }}.tar.gz
    sha256: a4e7bd4c63ac51b4484829b84a3ad998260678e228bf8e068f0889ec83484e8a

build:
  script: ${{ PYTHON }} -m pip install .
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - onnx >=1.16
    - spox >=0.17
    - typing-extensions
  run_constraints:
    - onnxruntime >=1.26.0
    - onnxruntime-novec >=1.26.0

tests:
  - python:
      imports:
        - ndonnx
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/quantco/ndonnx
  summary: ONNX backed array library compliant with Array API standard.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbourjau
    - RobertGabrielTrifanQC
    - sgilm
